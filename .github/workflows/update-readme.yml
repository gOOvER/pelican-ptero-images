name: Update README with Docker Images

on:
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '!.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan and update README
        id: update
        run: |
          echo "🔍 Scanning repository for Docker images..."

          # Function to get versions from a directory
          get_versions() {
            local dir="$1"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | grep -E '^[0-9]' | sort -V || true
            fi
          }

          # Function to get subdirectories
          get_subdirs() {
            local dir="$1"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort || true
            fi
          }

          # Function to check if image is in README
          check_image() {
            local pattern="$1"
            grep -q "$pattern" README.md
          }

          # Function to check if directory exists
          dir_exists() {
            [ -d "$1" ]
          }

          # Function to get versions from workflow matrix
          get_workflow_matrix_tags() {
            local wf="$1"
            if [ -f "$wf" ]; then
              sed -n "/matrix:/,/steps:/p" "$wf" | grep -E "^[[:space:]]+-[[:space:]]+" | grep -v ":" | grep -v "/" | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([^'\" ]+)['\"]?.*/\1/" | sort -V -u
            fi
          }

          # Function to get arm64-excluded tags from a workflow YAML (one tag per line)
          get_arm64_excluded_tags() {
            local workflow="$1"
            [ ! -f "$workflow" ] && echo "" && return
            python3 .github/scripts/get_arm64_excluded_tags.py "$workflow" 2>/dev/null || true
          }

          # Function to check if a tag appears in a newline-separated excluded-tags list
          is_arm64_excluded() {
            echo "$1" | grep -qxF "$2"
          }

          # Function to update the ARM64 column for an existing README entry
          update_arm64_column() {
            local image_name="$1"
            local arm64_flag="$2"
            python3 .github/scripts/update_arm64_column.py README.md "$image_name" "$arm64_flag"
          }

          CHANGES_MADE=""

          # ============================================
          # REMOVE DELETED IMAGES
          # ============================================
          echo "🗑️ Checking for deleted images..."

          # Remove deleted DotNet versions
          for v in $(grep -oP 'dotnet:\K[0-9.]+(?= \|)' README.md | sort -u); do
            if [ -f "dev/dotnet/Dockerfile" ]; then
              if ! get_workflow_matrix_tags ".github/workflows/dev-dotnet.yml" | grep -qxF "$v"; then
                echo "  ➖ Removing dotnet:$v (no longer in workflow)"
                sed -i "/| dotnet:$v /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed DotNet: $v\n"
              fi
            elif ! dir_exists "dev/dotnet/$v"; then
              echo "  ➖ Removing dotnet:$v (no longer exists)"
              sed -i "/| dotnet:$v /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed DotNet: $v\n"
            fi
          done

          # Remove deleted Java Base versions
          for v in $(grep -oP '\| java:\K[0-9]+(?= \|)' README.md | sort -u); do
            if [ -f "java/base/Dockerfile" ]; then
              if ! grep -q -E "-\s*['\"]?${v}['\"]?" .github/workflows/java-base.yml; then
                echo "  ➖ Removing java:$v (no longer exists)"
                sed -i "/| java:$v /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed Java Base: $v\n"
              fi
            elif ! dir_exists "java/base/$v"; then
              echo "  ➖ Removing java:$v (no longer exists)"
              sed -i "/| java:$v /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Java Base: $v\n"
            fi
          done

          # Remove deleted Java variant versions (GraalVM, Corretto, Zulu, Dragonwell, Liberica, Shenandoah)
          for jv in graalvm corretto zulu dragonwell liberica shenandoah; do
            for v in $(grep -oP "java:${jv}_\K[0-9]+" README.md | sort -u); do
              if [ -f "java/$jv/Dockerfile" ]; then
                if ! grep -q -E "-\s*['\"]?${v}['\"]?" .github/workflows/java-$jv.yml; then
                  echo "  ➖ Removing java:${jv}_$v (no longer exists)"
                  sed -i "/| java:${jv}_$v /d" README.md
                  CHANGES_MADE="${CHANGES_MADE}Removed Java ${jv^}: $v\n"
                fi
              elif ! dir_exists "java/$jv/$v"; then
                echo "  ➖ Removing java:${jv}_$v (no longer exists)"
                sed -i "/| java:${jv}_$v /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed Java ${jv^}: $v\n"
              fi
            done
          done

          # Remove deleted database versions
          for db in mariadb postgres mongodb redis; do
            for v in $(grep -oP "${db}:\K[a-zA-Z0-9.-]+(?= \|)" README.md | sort -u); do
              if [ -f "database/$db/Dockerfile" ] && [ -f ".github/workflows/db-$db.yml" ]; then
                if ! grep -q -E "-\s*['\"]?${v}['\"]?" .github/workflows/db-$db.yml; then
                  echo "  ➖ Removing $db:$v (no longer in workflow)"
                  sed -i "/| $db:$v /d" README.md
                  CHANGES_MADE="${CHANGES_MADE}Removed ${db^}: $v\n"
                fi
              elif ! dir_exists "database/$db/$v"; then
                echo "  ➖ Removing $db:$v (no longer exists)"
                sed -i "/| $db:$v /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed ${db^}: $v\n"
              fi
            done
          done

          # Remove deleted dev image versions
          for dev in nodejs python go elixir bun erlang dart rust mono; do
            for v in $(grep -oP "${dev}:\K[a-zA-Z0-9.-]+(?= \|)" README.md | sort -u); do
              if [ -f "dev/$dev/Dockerfile" ] && [ -f ".github/workflows/dev-$dev.yml" ]; then
                if ! get_workflow_matrix_tags ".github/workflows/dev-$dev.yml" | grep -qxF "$v"; then
                  echo "  ➖ Removing $dev:$v (no longer in workflow)"
                  sed -i "/| $dev:$v /d" README.md
                  CHANGES_MADE="${CHANGES_MADE}Removed ${dev^}: $v\n"
                fi
              elif ! dir_exists "dev/$dev/$v"; then
                echo "  ➖ Removing $dev:$v (no longer exists)"
                sed -i "/| $dev:$v /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed ${dev^}: $v\n"
              fi
            done
          done

          # Remove deleted game images
          for game in $(grep -oP 'games:\K[a-z0-9-]+(?= \|)' README.md | sort -u); do
            if ! dir_exists "games/$game"; then
              echo "  ➖ Removing games:$game (no longer exists)"
              sed -i "/| games:$game /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Games: $game\n"
            fi
          done

          # Remove deleted bot images
          for bot in $(grep -oP 'bots:\K[a-z0-9-]+(?= \|)' README.md | sort -u); do
            if ! dir_exists "bots/$bot"; then
              echo "  ➖ Removing bots:$bot (no longer exists)"
              sed -i "/| bots:$bot /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Bots: $bot\n"
            fi
          done

          # Remove deleted Debian distro versions
          for deb in $(grep -oP 'debian:\K[a-z0-9-]+(?= \|)' README.md | sort -u); do
            if ! dir_exists "distros/debian/$deb"; then
              echo "  ➖ Removing debian:$deb (no longer exists)"
              sed -i "/| debian:$deb /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Debian: $deb\n"
            fi
          done

          # Remove deleted Ubuntu distro versions
          for ub in $(grep -oP 'ubuntu:\K[a-z0-9-]+(?= \|)' README.md | sort -u); do
            if ! dir_exists "distros/ubuntu/$ub"; then
              echo "  ➖ Removing ubuntu:$ub (no longer exists)"
              sed -i "/| ubuntu:$ub /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Ubuntu: $ub\n"
            fi
          done

          # Remove deleted Alpine distro versions
          for alp in $(grep -oP 'alpine:\K(latest|edge)(?= \|)' README.md | sort -u); do
            if [ -f "distros/alpine/Dockerfile" ]; then
              if ! get_workflow_matrix_tags ".github/workflows/distros-alpine.yml" | grep -qxF "$alp"; then
                echo "  ➖ Removing alpine:$alp (no longer in workflow)"
                sed -i "/| alpine:$alp /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed Alpine Distro: $alp\n"
              fi
            elif ! dir_exists "distros/alpine/$alp"; then
              echo "  ➖ Removing alpine:$alp (no longer exists)"
              sed -i "/| alpine:$alp /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Alpine Distro: $alp\n"
            fi
          done

          # Remove deleted Arch Linux distro versions
          for arch in $(grep -oP 'archlinux:\K[a-z0-9-]+(?= \|)' README.md | sort -u); do
            if [ -f "distros/archlinux/Dockerfile" ]; then
              if ! get_workflow_matrix_tags ".github/workflows/distros-archlinux.yml" | grep -qxF "$arch"; then
                echo "  ➖ Removing archlinux:$arch (no longer in workflow)"
                sed -i "/| archlinux:$arch /d" README.md
                CHANGES_MADE="${CHANGES_MADE}Removed Arch Linux: $arch\n"
              fi
            elif ! dir_exists "distros/archlinux/$arch"; then
              echo "  ➖ Removing archlinux:$arch (no longer exists)"
              sed -i "/| archlinux:$arch /d" README.md
              CHANGES_MADE="${CHANGES_MADE}Removed Arch Linux: $arch\n"
            fi
          done

          # ============================================
          # ADD NEW IMAGES
          # ============================================
          echo ""
          echo "➕ Checking for new images..."

          # ============================================
          # Check Java Base versions
          # ============================================
          echo "📦 Checking Java Base..."
          if [ -f "java/base/Dockerfile" ]; then
            base_versions=$(sed -n "/matrix:/,/steps:/p" .github/workflows/java-base.yml | grep -E "^[[:space:]]+-[[:space:]]+" | grep -v ":" | grep -v "/" | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([^'\" ]+)['\"]?.*/\1/" | sort -V -u)
          else
            base_versions=$(get_versions "java/base")
          fi
          for v in $base_versions; do
            if ! check_image "java:$v "; then
              echo "  ➕ Adding java:$v"
              last_java=$(grep -n "| java:[0-9]" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_java" ]; then
                sed -i "${last_java}a\\| java:$v | \`ghcr.io/goover/java:$v\` | ✅ | ✅ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Java Base: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Java variant versions (GraalVM, Corretto, Zulu, Dragonwell, Liberica)
          # ============================================
          for jv in graalvm corretto zulu dragonwell liberica; do
            echo "📦 Checking Java ${jv^}..."
            if [ -f "java/$jv/Dockerfile" ]; then
              jv_versions=$(sed -n "/matrix:/,/steps:/p" .github/workflows/java-$jv.yml | grep -E "^[[:space:]]+-[[:space:]]+" | grep -v ":" | grep -v "/" | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([^'\" ]+)['\"]?.*/\1/" | sort -V -u)
            else
              jv_versions=$(get_versions "java/$jv")
            fi
            for v in $jv_versions; do
              if ! check_image "java:${jv}_$v "; then
                echo "  ➕ Adding java:${jv}_$v"
                last_jv=$(grep -n "| java:${jv}_" README.md | tail -1 | cut -d: -f1)
                if [ -n "$last_jv" ]; then
                  sed -i "${last_jv}a\\| java:${jv}_$v | \`ghcr.io/goover/java:${jv}_$v\` | ✅ | ✅ |" README.md
                  CHANGES_MADE="${CHANGES_MADE}Added Java ${jv^}: $v\n"
                fi
              fi
            done
          done

          # ============================================
          # Check Java Shenandoah versions
          # ============================================
          echo "📦 Checking Java Shenandoah..."
          shenandoah_excluded=$(get_arm64_excluded_tags ".github/workflows/java-shenandoah.yml")
          if [ -f "java/shenandoah/Dockerfile" ]; then
            shen_versions=$(sed -n "/matrix:/,/steps:/p" .github/workflows/java-shenandoah.yml | grep -E "^[[:space:]]+-[[:space:]]+" | grep -v ":" | grep -v "/" | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([^'\" ]+)['\"]?.*/\1/" | sort -V -u)
          else
            shen_versions=$(get_versions "java/shenandoah")
          fi
          for v in $shen_versions; do
            if ! check_image "java:shenandoah_$v "; then
              echo "  ➕ Adding java:shenandoah_$v"
              last_shenandoah=$(grep -n "| java:shenandoah_" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_shenandoah" ]; then
                if is_arm64_excluded "$shenandoah_excluded" "$v"; then
                  arm64_status="❌"
                else
                  arm64_status="✅"
                fi
                sed -i "${last_shenandoah}a\\| java:shenandoah_$v | \`ghcr.io/goover/java:shenandoah_$v\` | ✅ | ${arm64_status} |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Java Shenandoah: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Database versions
          # ============================================
          for db in mariadb postgres mongodb redis; do
            echo "📦 Checking $db..."
            if [ -f "database/$db/Dockerfile" ] && [ -f ".github/workflows/db-$db.yml" ]; then
              db_versions=$(sed -n "/matrix:/,/steps:/p" .github/workflows/db-$db.yml | grep -E "^[[:space:]]+-[[:space:]]+" | grep -v ":" | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([^'\" ]+)['\"]?.*/\1/")
            else
              db_versions=$(get_versions "database/$db")
            fi
            for v in $db_versions; do
              if ! check_image "$db:$v "; then
                echo "  ➕ Adding $db:$v"
                last_db=$(grep -n "| $db:" README.md | tail -1 | cut -d: -f1)
                if [ -n "$last_db" ]; then
                  sed -i "${last_db}a\\| $db:$v | \`ghcr.io/goover/$db:$v\` | ✅ | ✅ |" README.md
                  CHANGES_MADE="${CHANGES_MADE}Added ${db^}: $v\n"
                fi
              fi
            done
          done

          # ============================================
          # Check Dev images (nodejs, python, go, etc.)
          # ============================================
          for dev in nodejs python go elixir; do
            echo "📦 Checking $dev..."
            if [ -f "dev/$dev/Dockerfile" ] && [ -f ".github/workflows/dev-$dev.yml" ]; then
              dev_versions=$(get_workflow_matrix_tags ".github/workflows/dev-$dev.yml")
            else
              dev_versions=$(get_versions "dev/$dev")
            fi
            for v in $dev_versions; do
              if ! check_image "$dev:$v "; then
                echo "  ➕ Adding $dev:$v"
                last_dev=$(grep -n "| $dev:" README.md | tail -1 | cut -d: -f1)
                if [ -n "$last_dev" ]; then
                  sed -i "${last_dev}a\\| $dev:$v | \`ghcr.io/goover/$dev:$v\` | ✅ | ✅ |" README.md
                  CHANGES_MADE="${CHANGES_MADE}Added ${dev^}: $v\n"
                fi
              fi
            done
          done

          # ============================================
          # Check DotNet versions
          # ============================================
          echo "📦 Checking dotnet..."
          if [ -f "dev/dotnet/Dockerfile" ]; then
            dotnet_versions=$(get_workflow_matrix_tags ".github/workflows/dev-dotnet.yml")
          else
            dotnet_versions=$(get_versions "dev/dotnet")
          fi
          for v in $dotnet_versions; do
            if ! check_image "dotnet:$v "; then
              echo "  ➕ Adding dotnet:$v"
              last_dotnet=$(grep -n "| dotnet:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_dotnet" ]; then
                sed -i "${last_dotnet}a\\| dotnet:$v | \`ghcr.io/goover/dotnet:$v\` | ✅ | ✅ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added DotNet: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Game images
          # ============================================
          echo "📦 Checking games..."
          for game in $(get_subdirs "games"); do
            if ! check_image "games:$game "; then
              echo "  ➕ Adding games:$game"
              last_game=$(grep -n "| games:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_game" ]; then
                sed -i "${last_game}a\\| games:$game | \`ghcr.io/goover/games:$game\` | ✅ | ❌ | ${game^} Server |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Games: $game\n"
              fi
            fi
          done

          # ============================================
          # Check Bot images
          # ============================================
          echo "📦 Checking bots..."
          for bot in $(get_subdirs "bots"); do
            if ! check_image "bots:$bot "; then
              echo "  ➕ Adding bots:$bot"
              last_bot=$(grep -n "| bots:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_bot" ]; then
                sed -i "${last_bot}a\\| bots:$bot | \`ghcr.io/goover/bots:$bot\` | ✅ | ❌ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Bots: $bot\n"
              fi
            fi
          done

          # ============================================
          # Check Debian distro versions
          # ============================================
          echo "📦 Checking Debian distros..."
          for v in $(get_subdirs "distros/debian"); do
            if ! check_image "debian:$v "; then
              echo "  ➕ Adding debian:$v"
              last_deb=$(grep -n "| debian:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_deb" ]; then
                sed -i "${last_deb}a\\| debian:$v | \`ghcr.io/goover/debian:$v\` | ✅ | ✅ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Debian: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Ubuntu distro versions
          # ============================================
          echo "📦 Checking Ubuntu distros..."
          for v in $(get_subdirs "distros/ubuntu"); do
            if ! check_image "ubuntu:$v "; then
              echo "  ➕ Adding ubuntu:$v"
              last_ub=$(grep -n "| ubuntu:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_ub" ]; then
                sed -i "${last_ub}a\\| ubuntu:$v | \`ghcr.io/goover/ubuntu:$v\` | ✅ | ✅ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Ubuntu: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Alpine distro versions
          # ============================================
          echo "📦 Checking Alpine distros..."
          if [ -f "distros/alpine/Dockerfile" ]; then
            alp_versions=$(get_workflow_matrix_tags ".github/workflows/distros-alpine.yml")
          else
            alp_versions=$(get_subdirs "distros/alpine")
          fi
          for v in $alp_versions; do
            if ! check_image "alpine:$v "; then
              echo "  ➕ Adding alpine:$v"
              last_alp=$(grep -n -E "\| alpine:(latest|edge)" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_alp" ]; then
                sed -i "${last_alp}a\\| alpine:$v | \`ghcr.io/goover/alpine:$v\` | ✅ | ✅ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Alpine Distro: $v\n"
              fi
            fi
          done

          # ============================================
          # Check Arch Linux distro versions
          # ============================================
          echo "📦 Checking Arch Linux distros..."
          if [ -f "distros/archlinux/Dockerfile" ]; then
            arch_versions=$(get_workflow_matrix_tags ".github/workflows/distros-archlinux.yml")
          else
            arch_versions=$(get_subdirs "distros/archlinux")
          fi
          for v in $arch_versions; do
            if ! check_image "archlinux:$v "; then
              echo "  ➕ Adding archlinux:$v"
              last_arch=$(grep -n "| archlinux:" README.md | tail -1 | cut -d: -f1)
              if [ -n "$last_arch" ]; then
                sed -i "${last_arch}a\\| archlinux:$v | \`ghcr.io/goover/archlinux:$v\` | ✅ | ❌ |" README.md
                CHANGES_MADE="${CHANGES_MADE}Added Arch Linux: $v\n"
              fi
            fi
          done

          # ============================================
          # UPDATE ARM64 STATUS FOR EXISTING ENTRIES
          # Reads each workflow's exclude list and syncs
          # the ARM64 column in the README accordingly.
          # ============================================
          echo ""
          echo "🔄 Syncing ARM64 status for existing entries..."

          declare -A JAVA_WORKFLOWS=(
            ["base"]=".github/workflows/java-base.yml"
            ["shenandoah"]=".github/workflows/java-shenandoah.yml"
            ["corretto"]=".github/workflows/java-corretto.yml"
            ["zulu"]=".github/workflows/java-zulu.yml"
            ["liberica"]=".github/workflows/java-liberica.yml"
            ["dragonwell"]=".github/workflows/java-dragonwell.yml"
            ["graalvm"]=".github/workflows/java-graalvm.yml"
          )

          for variant in "${!JAVA_WORKFLOWS[@]}"; do
            workflow="${JAVA_WORKFLOWS[$variant]}"
            excluded=$(get_arm64_excluded_tags "$workflow")
            if [ -f "java/$variant/Dockerfile" ]; then
              jv_list=$(get_workflow_matrix_tags "$workflow")
            else
              jv_list=$(get_versions "java/$variant")
            fi
            for v in $jv_list; do
              if [ "$variant" = "base" ]; then
                image="java:$v"
              else
                image="java:${variant}_$v"
              fi
              if is_arm64_excluded "$excluded" "$v"; then
                arm64_flag="❌"
              else
                arm64_flag="✅"
              fi
              result=$(update_arm64_column "$image" "$arm64_flag")
              if [ -n "$result" ]; then
                echo "$result"
                CHANGES_MADE="${CHANGES_MADE}Updated ARM64 for $image: $arm64_flag\n"
              fi
            done
          done

          # Output result
          if [ -n "$CHANGES_MADE" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo ""
            echo "✅ Changes made:"
            echo -e "$CHANGES_MADE"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ README is already up to date!"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add new Docker images to README"
          title: "📝 Update README - New Docker Images Detected"
          body: |
            ## 🤖 Automated README Update

            This PR adds newly detected Docker images to the README.

            ### What changed:
            - New image entries have been added to the appropriate tables in README.md
            - All new entries follow the existing format

            ---

            *This PR was created automatically by the [Update README](.github/workflows/update-readme.yml) workflow.*
          branch: docs/readme-images-${{ github.run_number }}
          delete-branch: true
