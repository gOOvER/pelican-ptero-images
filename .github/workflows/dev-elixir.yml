name: build elixir

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - dev/elixir/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "elixir:${{ matrix.tag }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tag:
          - '1.14'
          - '1.15'
          - '1.16'
          - latest
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: prep
        run: echo "platform_tag=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: ./dev/elixir
          file: ./dev/elixir/Dockerfile
          build-args: |
            ELIXIR_BASE=${{ matrix.tag == 'latest' && 'elixir:latest' || format('elixir:{0}-slim', matrix.tag) }}
          platforms: ${{ matrix.platform }}
          push: true
          network: host
          provenance: false
          tags: ghcr.io/goover/elixir:${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-from: type=gha,scope=elixir-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-to: type=gha,mode=max,scope=elixir-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}

  merge:
    name: "elixir:${{ matrix.tag }} (manifest)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - '1.14'
          - '1.15'
          - '1.16'
          - latest

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/goover/elixir:${{ matrix.tag }} \
            ghcr.io/goover/elixir:${{ matrix.tag }}-linux-amd64 \
            ghcr.io/goover/elixir:${{ matrix.tag }}-linux-arm64
