name: build mongodb

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - database/mongodb/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "mongodb:${{ matrix.tag }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 5
            base: mongo:5.0
            platform: linux/amd64
            runner: ubuntu-latest
          - tag: 5
            base: mongo:5.0
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - tag: 6
            base: mongo:6.0
            platform: linux/amd64
            runner: ubuntu-latest
          - tag: 6
            base: mongo:6.0
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - tag: 7
            base: mongo:7-jammy
            platform: linux/amd64
            runner: ubuntu-latest
          - tag: 7
            base: mongo:7-jammy
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: prep
        run: echo "platform_tag=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: ./database/mongodb
          file: ./database/mongodb/Dockerfile
          build-args: |
            MONGO_BASE=${{ matrix.base }}
          platforms: ${{ matrix.platform }}
          push: true
          network: host
          provenance: false
          tags: ghcr.io/goover/mongodb:${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-from: type=gha,scope=mongodb-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-to: type=gha,mode=max,scope=mongodb-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}

  merge:
    name: "mongodb:${{ matrix.tag }} (manifest)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 5
          - 6
          - 7

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/goover/mongodb:${{ matrix.tag }} \
            ghcr.io/goover/mongodb:${{ matrix.tag }}-linux-amd64 \
            ghcr.io/goover/mongodb:${{ matrix.tag }}-linux-arm64
