name: build apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - apps/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "apps:${{ matrix.oses }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        oses:
          - discordpush
          - uptimekuma
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: prep
        run: echo "platform_tag=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.oses }}
          file: ./apps/${{ matrix.oses }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          network: host
          provenance: false
          tags: ghcr.io/goover/apps:${{ matrix.oses }}-${{ steps.prep.outputs.platform_tag }}
          cache-from: type=gha,scope=apps-${{ matrix.oses }}-${{ steps.prep.outputs.platform_tag }}
          cache-to: type=gha,mode=max,scope=apps-${{ matrix.oses }}-${{ steps.prep.outputs.platform_tag }}

  merge:
    name: "apps:${{ matrix.oses }} (manifest)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oses:
          - discordpush
          - uptimekuma

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/goover/apps:${{ matrix.oses }} \
            ghcr.io/goover/apps:${{ matrix.oses }}-linux-amd64 \
            ghcr.io/goover/apps:${{ matrix.oses }}-linux-arm64
