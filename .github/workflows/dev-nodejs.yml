name: build nodejs

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - dev/nodejs/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: "nodejs:${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 16
          - 18
          - 20
          - 22
          - 24
          - 25
          - 26
        include:
          - tag: 16
            base: node:16-bookworm-slim
          - tag: 18
            base: node:18-bookworm-slim
          - tag: 20
            base: node:20-trixie-slim
          - tag: 22
            base: node:22-trixie-slim
          - tag: 24
            base: node:24-trixie-slim
          - tag: 25
            base: node:25-trixie-slim
          - tag: 26
            base: node:26-trixie-slim

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./dev/nodejs
          file: ./dev/nodejs/Dockerfile
          build-args: |
            NODE_BASE=${{ matrix.base }}
          platforms: linux/amd64,linux/arm64
          push: true
          network: host
          tags: |
            ghcr.io/goover/nodejs:${{ matrix.tag }}
          cache-from: type=gha,scope=nodejs-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=nodejs-${{ matrix.tag }}
