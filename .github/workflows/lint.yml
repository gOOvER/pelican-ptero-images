name: Lint & Code Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          failure-threshold: error
          ignore: DL3008,DL3007,DL3013,DL3018,DL4006

  shellcheck:
    name: Lint Shell Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: '.'
          ignore_paths: '.git .github'

  actionlint:
    name: Lint GitHub Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -ignore 'SC[0-9]+:(info|style)' -color
