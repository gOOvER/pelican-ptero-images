name: Cleanup Untagged GHCR Images

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: "cleanup:${{ matrix.package }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - java
          - debian
          - ubuntu
          - alpine
          - dotnet
          - nodejs
          - elixir
          - postgres
          - redis
          - mariadb
          - mongodb
          - keydb
          - python
          - rust
          - bun
          - dart
          - erlang
          - go
          - mono
          - wine
          - games

    steps:
      - name: Prune untagged versions for ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: ${{ github.repository_owner }}
          package-type: 'container'
          package-name: ${{ matrix.package }}
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
