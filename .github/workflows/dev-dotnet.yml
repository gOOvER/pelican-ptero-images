name: build dotnet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - dev/dotnet/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "dotnet:${{ matrix.tag }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tag:
          - '6'
          - '7'
          - '8'
          - '9'
          - '10'
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: prep
        run: echo "platform_tag=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7
        with:
          context: ./dev/dotnet
          file: ./dev/dotnet/Dockerfile
          build-args: |
            DOTNET_CHANNEL=${{ format('{0}.0', matrix.tag) }}
            BASE_IMAGE=debian:trixie-slim
          platforms: ${{ matrix.platform }}
          push: true
          network: host
          provenance: false
          tags: ghcr.io/goover/dotnet:${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-from: type=gha,scope=dotnet-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}
          cache-to: type=gha,mode=max,scope=dotnet-${{ matrix.tag }}-${{ steps.prep.outputs.platform_tag }}

  merge:
    name: "dotnet:${{ matrix.tag }} (manifest)"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - '6'
          - '7'
          - '8'
          - '9'
          - '10'

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/goover/dotnet:${{ matrix.tag }} \
            ghcr.io/goover/dotnet:${{ matrix.tag }}-linux-amd64 \
            ghcr.io/goover/dotnet:${{ matrix.tag }}-linux-arm64
